[package]
name = "herdr-perforce"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A compact Perforce review pane for Herdr"
license = "MIT"
publish = false

[lib]
name = "herdr_perforce"
path = "src/lib.rs"

[[bin]]
name = "herdr-p4"
path = "src/main.rs"

[dependencies]
blake3 = "1"
crossterm = "0.28"
ratatui = "0.29"
serde_json = "1"
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-themes",
    "dump-load",
    "regex-fancy",
] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
